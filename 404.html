<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد | Designab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            background: var(--background);
        }
        .error-page h1 {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-page h2 {
            font-size: 2rem;
            margin-bottom: 16px;
        }
        .error-page p {
            color: var(--text-secondary);
            max-width: 400px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1>۴۰۴</h1>
        <h2>صفحه مورد نظر پیدا نشد</h2>
        <p>صفحه‌ای که به دنبال آن هستید ممکن است حذف شده یا آدرس آن تغییر کرده باشد.</p>
        <a href="/" class="btn-primary">
            <i class="fa-solid fa-arrow-right"></i>
            بازگشت به صفحه اصلی
        </a>
    </div>
</body>
</html>
